<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{layout/main :: head(${isEdit ? 'Edit Region' : 'New Region'} + ' - Census Management System')}"></head>
<body>

<div th:replace="~{layout/main :: navbar}"></div>
<div th:replace="~{layout/main :: alerts}"></div>

<main class="container py-4" style="max-width: 650px;">
    <div class="card table-card p-4">
        <div class="mb-4 pb-2 border-bottom">
            <h3 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Region' : 'Register New Region'}">Region Form</h3>
            <p class="text-muted mb-0">Specify the State, District, and City/Ward combination. It must be unique.</p>
        </div>

        <form th:action="@{${isEdit ? '/regions/edit/' + region.id : '/regions/new'}}" th:object="${region}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="mb-3">
                <label for="state" class="form-label fw-semibold">State / Province <span class="text-danger">*</span></label>
                <input type="text" id="state" th:field="*{state}" class="form-control"
                       th:classappend="${#fields.hasErrors('state')} ? 'is-invalid'" placeholder="e.g. Maharashtra" required>
                <div class="invalid-feedback" th:errors="*{state}">State is required</div>
            </div>

            <div class="mb-3">
                <label for="district" class="form-label fw-semibold">District <span class="text-danger">*</span></label>
                <input type="text" id="district" th:field="*{district}" class="form-control"
                       th:classappend="${#fields.hasErrors('district')} ? 'is-invalid'" placeholder="e.g. Mumbai Suburban" required>
                <div class="invalid-feedback" th:errors="*{district}">District is required</div>
            </div>

            <div class="mb-4">
                <label for="city" class="form-label fw-semibold">City / Ward / Sub-district <span class="text-danger">*</span></label>
                <input type="text" id="city" th:field="*{city}" class="form-control"
                       th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'" placeholder="e.g. Andheri" required>
                <div class="invalid-feedback" th:errors="*{city}">City is required</div>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/regions}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check2-circle me-1"></i> <span th:text="${isEdit ? 'Update Region' : 'Save Region'}">Save</span>
                </button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
