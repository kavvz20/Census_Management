<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head th:replace="~{layout/main :: head(${isEdit ? 'Edit Household' : 'Register Household'} + ' - Census Management System')}"></head>
<body>

<div th:replace="~{layout/main :: navbar}"></div>
<div th:replace="~{layout/main :: alerts}"></div>

<main class="container py-4" style="max-width: 700px;">
    <div class="card table-card p-4">
        <div class="mb-4 pb-2 border-bottom">
            <h3 class="fw-bold mb-1" th:text="${isEdit ? 'Edit Household Details' : 'Register New Household'}">Household Form</h3>
            <p class="text-muted mb-0">Record dwelling infrastructure, utilities, and location details.</p>
        </div>

        <form th:action="@{${isEdit ? '/households/' + household.id + '/edit' : '/households/new'}}"
              th:object="${household}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <!-- Region Selection -->
            <div class="mb-3" sec:authorize="hasRole('ADMIN')">
                <label for="regionId" class="form-label fw-semibold">Region Jurisdiction <span class="text-danger">*</span></label>
                <select id="regionId" th:field="*{regionId}" class="form-select"
                        th:classappend="${#fields.hasErrors('regionId')} ? 'is-invalid'" required>
                    <option value="">-- Select Region --</option>
                    <option th:each="r : ${regions}" th:value="${r.id}" th:text="${r.fullName}">Region</option>
                </select>
                <div class="invalid-feedback" th:errors="*{regionId}">Region is required</div>
            </div>

            <!-- Enumerator fixed region -->
            <div class="mb-3" sec:authorize="hasRole('ENUMERATOR')">
                <label class="form-label fw-semibold">Assigned Region</label>
                <input type="text" class="form-control bg-light" th:value="${currentUser.regionName}" readonly>
                <input type="hidden" th:field="*{regionId}" th:value="${currentUser.regionId}">
                <div class="form-text text-muted">Fixed to your designated jurisdiction.</div>
            </div>

            <div class="mb-3">
                <label for="address" class="form-label fw-semibold">Residential Street Address <span class="text-danger">*</span></label>
                <textarea id="address" th:field="*{address}" class="form-control" rows="2"
                          th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'"
                          placeholder="e.g. Flat 301, Building B, Shanti Nagar..." required></textarea>
                <div class="invalid-feedback" th:errors="*{address}">Address is required</div>
            </div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="houseType" class="form-label fw-semibold">Dwelling / House Type <span class="text-danger">*</span></label>
                    <select id="houseType" th:field="*{houseType}" class="form-select"
                            th:classappend="${#fields.hasErrors('houseType')} ? 'is-invalid'" required>
                        <option value="">-- Select Dwelling Type --</option>
                        <option value="Apartment">Apartment / Flat</option>
                        <option value="Pucca">Pucca (Permanent Concrete)</option>
                        <option value="Semi-Pucca">Semi-Pucca</option>
                        <option value="Kutcha">Kutcha (Temporary)</option>
                        <option value="Independent House">Independent Bungalow / Villa</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{houseType}">House type is required</div>
                </div>

                <div class="col-md-6">
                    <label for="water" class="form-label fw-semibold">Primary Drinking Water Source <span class="text-danger">*</span></label>
                    <select id="water" th:field="*{water}" class="form-select"
                            th:classappend="${#fields.hasErrors('water')} ? 'is-invalid'" required>
                        <option value="">-- Select Water Source --</option>
                        <option value="Tap Water">Treated Tap Water</option>
                        <option value="Piped Water">Piped Borewell</option>
                        <option value="Covered Well">Covered Well</option>
                        <option value="Hand Pump">Hand Pump</option>
                        <option value="Public Tanker">Public Tanker</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{water}">Water source is required</div>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label for="contactNumber" class="form-label fw-semibold">Contact Phone Number (Optional)</label>
                    <input type="text" id="contactNumber" th:field="*{contactNumber}" class="form-control"
                           th:classappend="${#fields.hasErrors('contactNumber')} ? 'is-invalid'" placeholder="e.g. 9820011223" maxlength="15">
                    <div class="invalid-feedback" th:errors="*{contactNumber}">Invalid phone number</div>
                </div>

                <div class="col-md-6 d-flex align-items-center mt-4 pt-2">
                    <div class="form-check form-switch fs-5">
                        <input class="form-check-input" type="checkbox" role="switch" id="electricity" th:field="*{electricity}">
                        <label class="form-check-label fs-6 fw-semibold ms-2" for="electricity">Electricity Connection Available</label>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between">
                <a th:href="@{/households}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left me-1"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check2-circle me-1"></i> <span th:text="${isEdit ? 'Save Changes' : 'Register Household'}">Save</span>
                </button>
            </div>
        </form>
    </div>
</main>

<div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
