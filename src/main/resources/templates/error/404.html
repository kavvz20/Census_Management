<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{layout/main :: head('Page Not Found (404) - Census Management System')}"></head>
<body class="bg-light">

<div th:replace="~{layout/main :: navbar}"></div>

<div class="container py-5 text-center" style="max-width: 600px;">
    <div class="card table-card p-5 border-top border-warning border-4">
        <div class="text-warning mb-3">
            <i class="bi bi-question-circle" style="font-size: 4rem;"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">404 - Resource Not Found</h2>
        <p class="text-muted mb-4" th:text="${message != null ? message : 'The requested census record, household, or page could not be located.'}">
            The requested resource was not found.
        </p>
        <div>
            <a th:href="@{/}" class="btn btn-primary px-4 me-2">
                <i class="bi bi-house-door me-1"></i> Return Home
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                <i class="bi bi-arrow-left me-1"></i> Go Back
            </a>
        </div>
    </div>
</div>

<div th:replace="~{layout/main :: footer}"></div>
</body>
</html>
