# Application Configuration
spring.application.name=Census-Management-System
server.port=${PORT:8080}

# Active Profile: default uses SQLite (zero server setup, file-based persistence: census.db)
# To use MySQL instead: run with --spring.profiles.active=mysql
spring.profiles.active=default

# Default SQLite Database Configuration (Embedded Single-File Database)
spring.datasource.url=jdbc:sqlite:census.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate Configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# JWT Security Configuration
app.jwt.secret=9a67c4e59b6348b1a646738914e1a90c9b0e12f348612faca0d2e85a73ef890a
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.census.management=INFO
logging.level.org.springframework.security=WARN
